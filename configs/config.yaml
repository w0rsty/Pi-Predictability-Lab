# Базовые параметры генерации, сплита и обучения по умолчанию.
# Отдельные эксперименты (04–07) переопределяют epochs, patience и amp_dtype под конкретный режим.

seed: 42

paths:
  data_dir: "data"
  runs_dir: "runs"

data:
  default_length: 1000000
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  default_window_size: 64

training:
  device: "cuda"
  use_amp: true
  batch_size: 512
  learning_rate: 0.001
  epochs: 30
  early_stopping_patience: 5
  num_workers: 4

hacked_pi:
  # Tier 1: периодический маркер каждые 50 шагов
  tier1:
    period: 50
    pattern: [7, 7, 7]
  # Tier 2: модульное правило по 3 цифрам окна -> ставим 9 через 2 шага
  tier2:
    mod_base: 7
    trigger_rem: 0
    offset: 2
    target_digit: 9
  # Tier 3: зашумлённое правило (срабатывает с вероятностью default_prob)
  tier3:
    default_prob: 0.5
