# Параметры генерации данных, сплита и обучения (seed зафиксирован для воспроизводимости)

seed: 42

paths:
  data_dir: "data"
  runs_dir: "runs"
  research_log: "docs/RESEARCH_LOG.md"

data:
  default_length: 1000000
  radixes: [2, 10, 16]
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  window_sizes: [32, 64, 128]
  default_window_size: 64

training:
  device: "cuda"
  use_amp: true
  batch_size: 512
  learning_rate: 0.001
  epochs: 30
  early_stopping_patience: 5
  num_workers: 4

hacked_pi:
  # Tier 1: периодический маркер каждые 50 шагов
  tier1:
    period: 50
    pattern: [7, 7, 7]
  # Tier 2: модульное правило по 3 цифрам окна -> ставим 9 через 2 шага
  tier2:
    mod_base: 7
    trigger_rem: 0
    offset: 2
    target_digit: 9
  # Tier 3: зашумлённое правило (срабатывает с вероятностью p)
  tier3:
    base_rule: "tier2"
    signal_probs: [0.1, 0.25, 0.5, 0.75, 1.0]
    default_prob: 0.5
